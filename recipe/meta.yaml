{% set version = "1.2.3" %}

package:
  name: glue-vispy-viewers
  version: {{version}}

source:
  fn: glue-vispy-viewers-{{version}}.tar.gz
  url: https://pypi.org/packages/source/g/glue-vispy-viewers/glue_vispy_viewers-1.2.3.tar.gz
  sha256: 72f1a5645920a79164c47ffad6ea61e3edd7415e389d2b5c6025ad52601a2545

build:
  number: 0
  # Skipping unnecessary linux platforms that don't need viz.
  skip: true  # [py<36 or ppc64le or s390x]
  script: pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv

requirements:
  host:
    - python
    - setuptools
    - setuptools_scm
    - wheel
    - pip
    - setuptools-scm
  run:
    - python
    - numpy
    - pyopengl
    - glue-core >=1.13.1
    - matplotlib-base
    - qtpy
    - scipy
    - astropy >=4.0
    - pillow
    - vispy >=0.12.0
    - pyqt >=5.9,<6.0a0
    - echo >=0.6
    - importlib-metadata >=3.6  # [py<310]
    - glfw
    - imageio
  run_constrained:
    - glue-qt >=0.1.0

test:
  imports:
    - glue_vispy_viewers
    - glue_vispy_viewers.scatter
    - glue_vispy_viewers.volume
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://glueviz.org
  license: BSD-2-Clause
  license_family: BSD
  license_file: LICENSE
  summary: 3D viewers for Glue
  description: 3D viewers for Glue using VisPy
  dev_url: https://github.com/glue-viz/glue-vispy-viewers
  doc_url: https://glueviz.org/en/stable/gui_guide/3d_viewers.html

extra:
  recipe-maintainers:
    - astrofrog-conda-forge
  skip-lints:
    - missing_doc_source_url
    - missing_license_url
    - gui_app
